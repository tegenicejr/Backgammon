<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4a2e1b"/>
      <stop offset="100%" stop-color="#1a110a"/>
    </radialGradient>
    <radialGradient id="pieceW" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2d7c5"/>
      <stop offset="100%" stop-color="#a4937a"/>
    </radialGradient>
    <radialGradient id="pieceB" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#555558"/>
      <stop offset="70%" stop-color="#232326"/>
      <stop offset="100%" stop-color="#0d0d0e"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#d4af37" stroke-width="6" opacity="0.4"/>
  <!-- Points -->
  <polygon points="120,32 160,200 80,200" fill="#a4422e" opacity="0.85"/>
  <polygon points="200,32 240,200 160,200" fill="#2b2622" opacity="0.85"/>
  <!-- Checkers -->
  <g filter="url(#sh)">
    <circle cx="190" cy="270" r="80" fill="url(#pieceB)"/>
    <circle cx="190" cy="270" r="54" fill="none" stroke="#666" stroke-width="4" opacity="0.6"/>
    <circle cx="320" cy="240" r="80" fill="url(#pieceW)"/>
    <circle cx="320" cy="240" r="54" fill="none" stroke="#fff" stroke-width="4" opacity="0.8"/>
  </g>
  <!-- Dice -->
  <g filter="url(#sh)" transform="translate(210, 310) rotate(12)">
    <rect width="90" height="90" rx="18" fill="#fdfbf7" stroke="#e0d6c3" stroke-width="3"/>
    <circle cx="45" cy="45" r="9" fill="#c0392b"/>
    <circle cx="24" cy="24" r="7" fill="#2c3e50"/>
    <circle cx="66" cy="24" r="7" fill="#2c3e50"/>
    <circle cx="24" cy="66" r="7" fill="#2c3e50"/>
    <circle cx="66" cy="66" r="7" fill="#2c3e50"/>
  </g>
</svg>
